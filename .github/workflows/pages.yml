name: Deploy Ember Vault catalog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate public catalog
        run: python tools/verify_catalog.py embervault-catalog.json
      - name: Validate public submissions
        run: python tools/verify_submissions.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static catalog
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
